name: Build X DOCS Android APK
on:
  push:
    branches: [main]
    paths:
      - "xdocs_native/**"
      - ".github/workflows/xdocs-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p xdocs_native :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-DOCS-debug-apk
          path: xdocs_native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
