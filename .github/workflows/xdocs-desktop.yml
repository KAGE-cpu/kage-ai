name: Build X DOCS Desktop (Windows)

on:
  push:
    branches: [ xdocs-desktop-v1 ]
    paths:
      - 'xdocs_desktop/**'
      - '.github/workflows/xdocs-desktop.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -r xdocs_desktop/requirements.txt
      - name: Build portable application
        working-directory: xdocs_desktop
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name X-DOCS-Desktop --add-data "templates;templates" --collect-all fitz --collect-all docx --collect-all reportlab app.py
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: X-DOCS-Desktop-Windows
          path: xdocs_desktop/dist/X-DOCS-Desktop/
          if-no-files-found: error
          retention-days: 14
